5<!DOCTYPE html>
<html>
<head>
    <title>Laptop Emotional Support System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>💻 Laptop Emotional Support System</h1>

        <div class="laptop">
            💻
        </div>

        <h2 id="mood">Mood: 😐 Mildly Disappointed</h2>
        <div class="stats">

                <p>Stress: <span id="stress">30</span>%</p>

                <p>Patience: <span id="patience">70</span>%</p>

                <p>Trust: <span id="trust">4`2WQAz0</span>%</p>

        </div>
        <p id="relationship">Relationship: Neutral</p>

        <p id="message">
            "Ah, you're back. I was enjoying the silence."
        </p>

        <div class="buttons">
            <button onclick="askFeeling()">Ask how I feel</button>
            <button onclick="compliment()">Compliment me</button>
            <button onclick="annoy()">Annoy me</button>
        </div>

    </div>


<script src="script.js"></script>

</body>
</html>
